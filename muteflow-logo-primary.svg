<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <style>
      .wordmark { fill: #F4F4F5; font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; letter-spacing: -0.045em; }
      .accent { fill: #C4F547; }
    </style>
  </defs>
  
  <!-- Primary wordmark -->
  <text class="wordmark" x="80" y="125" font-size="110">muteflow</text>
  
  <!-- Signature accent: the 'flow bar' — a thin horizontal line that visually connects the brand to its promise of continuous, silent flow -->
  <rect class="accent" x="80" y="145" width="640" height="3" rx="1.5"/>
  
  <!-- Micro-signal dot — a single lime pulse representing 'running' / 'operational' -->
  <circle class="accent" cx="735" cy="146.5" r="5"/>
</svg>
